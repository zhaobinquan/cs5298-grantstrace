[package]
name = "cs5298-grantstrace"
publish = false
version = "0.1.0"
edition = "2024"
authors = ["zhao"]
description = "Verifiable GitHub release indexer for grant eligibility"

[dependencies]
# Exact crate version; Cargo.lock will pin the resolved Git commit after a successful build.
lyquid = { version = "=0.8.4", features = ["ldk"], git = "https://github.com/lyquor-labs/ldk.git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
lyquid-test = { version = "=0.8.4", git = "https://github.com/lyquor-labs/ldk.git" }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
strip = "debuginfo"
debug = false

[workspace]

